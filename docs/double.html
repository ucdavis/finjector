<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Two Chart String Lookups | Finjector Demo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">

    <script src="https://finjector.ucdavis.edu/finjector.js?v=1"></script>
    <!-- <script src="https://localhost:3000/finjector.js?v=1"></script> -->

    <style>
        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            padding-top: 40px;
            padding-bottom: 40px;
            background-color: #f5f5f5;
        }

        .form-signin {
            max-width: 630px;
            padding: 15px;
            overflow-wrap: anywhere;
        }
        .form-signin .form-control { border-color: #737980; }
        .form-signin .form-text { color: #565e64 !important; }
        .form-signin :focus-visible {
            outline: 3px solid #0047ba;
            outline-offset: 2px;
        }

        .form-signin .form-floating:focus-within {
            z-index: 2;
        }

        .form-signin input[type="email"] {
            margin-bottom: -1px;
            border-bottom-right-radius: 0;
            border-bottom-left-radius: 0;
        }

        .form-signin input[type="password"] {
            margin-bottom: 10px;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }

        .bd-placeholder-img {
            font-size: 1.125rem;
            text-anchor: middle;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        @media (min-width: 768px) {
            .bd-placeholder-img-lg {
                font-size: 3.5rem;
            }
        }

        .b-example-divider {
            height: 3rem;
            background-color: rgba(0, 0, 0, .1);
            border: solid rgba(0, 0, 0, .15);
            border-width: 1px 0;
            box-shadow: inset 0 .5em 1.5em rgba(0, 0, 0, .1), inset 0 .125em .5em rgba(0, 0, 0, .15);
        }

        .b-example-vr {
            flex-shrink: 0;
            width: 1.5rem;
            height: 100vh;
        }

        .bi {
            vertical-align: -.125em;
            fill: currentColor;
        }

        .nav-scroller {
            position: relative;
            z-index: 2;
            height: 2.75rem;
            overflow-y: hidden;
        }

        .nav-scroller .nav {
            display: flex;
            flex-wrap: nowrap;
            padding-bottom: 1rem;
            margin-top: -1px;
            overflow-x: auto;
            text-align: center;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>

<body class="text-center">

    <main class="form-signin w-100 m-auto">
        <form>
            <h1 class="h3 mb-3 fw-normal">Please enter your account information</h1>

            <div class="input-group">
                <div class="form-floating">
                    <input type="text" class="form-control" id="ccoa-input" aria-describedby="ccoa-help" placeholder=" ">
                    <label for="ccoa-input">First Full Chart String</label>
                </div>
                <button type="button" class="btn btn-secondary" id="lookup" aria-label="Lookup first chart string">Lookup</button>
            </div>
            <small id="ccoa-help" class="form-text text-muted">Enter a GL or PPM chart string. Example PPM account:
                K30APSD227-TASK01-APLS002-770000</small>

            <hr />
            <div class="input-group">
                <div class="form-floating">
                    <input type="text" class="form-control" id="ccoa-input2" aria-describedby="ccoa-help2" placeholder=" ">
                    <label for="ccoa-input2">Second Full Chart String</label>
                </div>
                <button type="button" class="btn btn-secondary" id="lookup2" aria-label="Lookup second chart string">Lookup</button>
            </div>
            <small id="ccoa-help2" class="form-text text-muted">Enter a GL or PPM chart string. Example PPM account:
                K30APSD227-TASK01-APLS002-770000</small>

            <hr />
            <button class="w-100 btn btn-lg btn-primary" type="submit">Fake Submit</button>
        </form>
    </main>

    <script>
        function bindLookup(inputId, buttonId) {
            const input = document.getElementById(inputId);
            const button = document.getElementById(buttonId);

            button.addEventListener('click', async () => {
                const response = await window.Finjector.findChartSegmentString("https://localhost:3000/");
                if (response.status === "success") {
                    input.value = response.data;
                    input.focus();
                }
            });

            input.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' && !event.isComposing) {
                    event.preventDefault();
                    button.click();
                }
            });
        }

        bindLookup('ccoa-input', 'lookup');
        bindLookup('ccoa-input2', 'lookup2');
    </script>

</body>

</html>
